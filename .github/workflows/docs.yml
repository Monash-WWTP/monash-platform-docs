name: documentation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned platform revision
        id: platform
        run: python3 -c 'import json; print("revision=" + json.load(open("reference/platform.json"))["revision"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Monash-WWTP/monash-platform
          ref: ${{ steps.platform.outputs.revision }}
          path: .platform-source
      - uses: astral-sh/setup-uv@v6
      - run: python3 scripts/check-source.py --source .platform-source
      - run: PYTHONPATH=services/api uv run --locked python "$GITHUB_WORKSPACE/scripts/check-examples.py"
        working-directory: .platform-source
      - run: rm -rf .platform-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:docs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-manual
          path: out
